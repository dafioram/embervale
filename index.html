<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embervale: The Ember Road</title>
  <meta name="description" content="A small hero-party action RPG in your browser. Act I: The Ember Road.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 C10 10 8 14 10 20 C11 26 15 30 16 30 C17 30 21 26 22 20 C24 14 22 10 16 2Z' fill='%23ff7a1a'/%3E%3Cpath d='M16 12 C13 17 13 20 14 24 C15 27 16 28 16 28 C16 28 17 27 18 24 C19 20 19 17 16 12Z' fill='%23ffd27a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <div id="hud" class="hidden">
      <div id="party"></div>

      <div id="topbar">
        <div id="zone-name"></div>
        <div class="top-right">
          <span id="gold" title="Gold">0</span>
          <span id="clock" title="Time played">0:00</span>
          <button class="tb" data-act="log" title="Quest log (L)">Quests</button>
          <button class="tb" data-act="hero" title="Hero sheet (C)">Hero</button>
          <button class="tb" data-act="pack" title="Inventory and pack (I)">Pack</button>
          <button class="tb" data-act="menu" title="Menu (Esc)">Menu</button>
        </div>
      </div>

      <div id="tracker"></div>
      <div id="target" class="hidden">
        <img class="tg-portrait" alt="">
        <div class="tg-col">
          <div class="tg-head"><span class="tg-name"></span><span class="tg-lvl"></span></div>
          <div class="tg-bar"><div class="tg-fill"></div><span class="tg-hp"></span></div>
          <div class="tg-buffs"></div>
        </div>
      </div>
      <div id="eventbar" class="hidden"></div>
      <div id="toasts"></div>
      <div id="pausetag" class="hidden">Paused — press P</div>
      <div id="fps" class="hidden"></div>

      <div id="console">
        <div id="mm-wrap">
          <canvas id="minimap" width="440" height="220"></canvas>
          <div id="mm-zone"></div>
        </div>
        <div id="unit-panel">
          <div id="unit-head"><img id="unit-portrait" alt=""><div><div id="unit-name"></div><div id="unit-sub"></div></div></div>
          <div id="unit-xp"><div id="unit-xp-fill"></div><span id="unit-xp-text"></span></div>
          <div id="unit-stats"></div>
          <div id="unit-buffs"></div>
        </div>
        <div id="abilities"></div>
        <div id="inv"></div>
        <div id="cmds">
          <button class="cmd" data-cmd="amove" title="Attack-move (A)">&#9876;<i>A</i></button>
          <button class="cmd" data-cmd="stop" title="Stop (S)">&#9632;<i>S</i></button>
          <button class="cmd" data-cmd="hold" title="Hold position (H)">&#9875;<i>H</i></button>
          <button class="cmd" data-cmd="all" title="Select whole party (Ctrl+A or `)">&#9673;<i>`</i></button>
        </div>
      </div>
    </div>

    <div id="tooltip" class="hidden"></div>
    <div id="modals"></div>
    <div id="fade"></div>

    <div id="title" class="hidden">
      <div class="title-inner">
        <div class="ember-logo"></div>
        <h1>Embervale</h1>
        <h2>Act I &middot; The Ember Road</h2>
        <div id="title-buttons"></div>
        <p class="title-note">A hero-party adventure for mouse and keyboard (controllers work too). Progress saves in this browser; export a JSON file from the menu to back it up or move it.</p>
      </div>
    </div>
    <input type="file" id="import-file" accept="application/json,.json" hidden>
  </div>

  <!-- Engine -->
  <script src="js/core/util.js"></script>
  <!-- Data -->
  <script src="js/data/heroes.js"></script>
  <script src="js/data/abilities.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/units.js"></script>
  <script src="js/data/zones.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/data/underhollow.js"></script>
  <!-- Systems -->
  <script src="js/core/worldgen.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/music.js"></script>
  <script src="js/core/save.js"></script>
  <script src="js/core/fx.js"></script>
  <script src="js/core/combat.js"></script>
  <script src="js/core/ai.js"></script>
  <script src="js/core/world.js"></script>
  <script src="js/render/sprites.js"></script>
  <script src="js/render/render.js"></script>
  <script src="js/render/atmos.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/gamepad.js"></script>
  <script src="js/ui/ui.js"></script>
  <script src="js/game.js"></script>
  <script>G.game.boot();</script>
</body>
</html>
